</style></head><body><div id="app"></div><noscript>Tehara needs JavaScript to play.</noscript><script>/* ============================================
   TEHARA: the rules engine
   Every win or fail in the game is decided here, not in the level code,
   so a level can't teach something the halacha doesn't say.
   Each rule returns { ok/result, rule, src } where src names the
   controlling source (Rambam's Sefer Taharah first).
   Research and full quotes: docs/research/02-*.md and 03-*.md
   ============================================ */
const Tumah = (function () {
  // ---------- 1. What conveys tumah, and how ----------
  // Modes: touch (מגע), carry (משא, which includes moving it: היסט),
  // ohel (being under one roof with it, or over it).
  const CONVEYS = {
    // A corpse: touch, carry and ohel (Rambam Tumat Met 1:1-2, 1:10)
    met:        { touch: true,  carry: true,  ohel: true,  src: 'Rambam, Tumat Met 1:1-2, 1:10' },
    // A closed grave with the tumah inside: touch and ohel, Torah law (Tumat Met 2:15)
    grave:      { touch: true,  carry: false, ohel: true,  src: 'Rambam, Tumat Met 2:15' },
    // A single bone, even barley-sized: touch and carry, never ohel (Tumat Met 2:10)
    bone:       { touch: true,  carry: true,  ohel: false, src: 'Rambam, Tumat Met 2:10' },
    // Earth of a field where a grave was plowed: touch and carry, not ohel; Rabbinic (Tumat Met 10:2)
    plowedField:{ touch: true,  carry: true,  ohel: false, src: 'Rambam, Tumat Met 10:2; Oholot 18:2' },
    // A field where a whole grave was lost: touch, carry and ohel (Oholot 18:3)
    lostGraveField: { touch: true, carry: true, ohel: true, src: 'Mishnah Oholot 18:3; Moed Katan 5b' },
    // A sheretz (dead mouse, lizard): touch only, not carry, not ohel (She'ar Avot HaTumot 4:2)
    sheretz:    { touch: true,  carry: false, ohel: false, src: "Rambam, She'ar Avot HaTumot 4:2" },
    // A nevelah (an animal that died by itself): touch and carry, not ohel (She'ar Avot HaTumot 1:1; Tumat Met 1:10)
    nevelah:    { touch: true,  carry: true,  ohel: false, src: "Rambam, She'ar Avot HaTumot 1:1; Tumat Met 1:10" },
  };

  // Which kinds are part of tumat met (forbidden to a Kohen)
  const FROM_MET = { met: true, grave: true, bone: true, plowedField: true, lostGraveField: true };

  function conveys(kind, mode) {
    const k = CONVEYS[kind];
    if (!k) throw new Error('Unknown tumah kind: ' + kind);
    if (!(mode in k)) throw new Error('Unknown mode: ' + mode);
    return { result: k[mode], src: k.src };
  }

  // Moving something by pressing a plank it lies on counts as carrying (היסט)
  // (Rambam Tumat Met 1:7: "מסיט בכלל נושא")
  function moveViaPlank(kind) {
    return { result: conveys(kind, 'carry').result, src: 'Rambam, Tumat Met 1:7' };
  }

  // Walking over it, with nothing touching it
  function passOver(kind) {
    return conveys(kind, 'ohel');
  }

  // ---------- 2. Kohanim ----------
  // A Kohen may not become tamei from a met (Vayikra 21:1; Rambam Avel 3:1),
  // but may from every other tumah (Rambam Tumat Okhalin 16:9).
  function kohenMay(kind) {
    if (FROM_MET[kind]) return { ok: false, src: 'Vayikra 21:1; Rambam, Avel 3:1' };
    return { ok: true, src: 'Rambam, Tumat Okhalin 16:9' };
  }

  // A met "holds" 4 amot; a Kohen may not come inside them (Rambam Avel 3:13)
  const MET_DISTANCE_AMOT = 4;
  function kohenDistanceOk(amot) {
    return { ok: amot >= MET_DISTANCE_AMOT, src: 'Rambam, Avel 3:13' };
  }

  // ---------- 3. A person who touched something ----------
  // Returns the person's new status.
  function personTouches(kind) {
    if (kind === 'nevelah') return { status: 'rishon', until: 'evening', src: "Rambam, She'ar Avot HaTumot 1:1" };
    if (kind === 'sheretz') return { status: 'rishon', until: 'evening', src: 'Vayikra 11:31; Rambam, Tumat Met 5:7' };
    if (FROM_MET[kind]) return { status: 'tameiMet', until: 'day7', src: 'Bamidbar 19:11; Rambam, Tumat Met 5:1-2' };
    return { status: 'tahor' };
  }

  // A sheretz pushed away with a stick: it conveys only by touch, not by moving
  function personMovesWithStick(kind) {
    const carries = conveys(kind, 'carry').result;
    return { status: carries ? personTouches(kind).status : 'tahor', src: conveys(kind, 'carry').src };
  }

  // Eating terumah: someone tamei until evening needs tevilah AND nightfall
  // (three medium stars) (Vayikra 22:7; Rambam Terumot 7:2)
  function canEatTerumah(p) {
    if (p.status === 'tahor') return { ok: true };
    if (p.status === 'tameiMet') return { ok: false, need: 'sprinkling', src: 'Bamidbar 19:12' };
    if (!p.immersed) return { ok: false, need: 'mikveh', src: 'Vayikra 22:6' };
    if (!p.starsOut) return { ok: false, need: 'stars', src: 'Rambam, Terumot 7:2' };
    return { ok: true, src: 'Rambam, Terumot 7:2' };
  }

  // ---------- 4. Ohel ----------
  // A cover of at least 1x1 tefach and 1 tefach high brings tumah and blocks it
  // (Rambam Tumat Met 12:1). A strong one does so by Torah law; a weak one
  // (thin branches) brings it by Rabbinic law and doesn't block (13:2).
  function ohelCover({ widthTefach = 1, heightTefach = 1, sturdy = true }) {
    if (widthTefach < 1 || heightTefach < 1) return { brings: false, blocks: false, src: 'Rambam, Tumat Met 12:1' };
    if (sturdy) return { brings: true, blocks: true, level: 'doraita', src: 'Rambam, Tumat Met 12:1, 13:2' };
    return { brings: true, blocks: false, level: 'derabbanan', src: 'Rambam, Tumat Met 13:2' };
  }

  // People and vessels can bring tumah as an ohel, but can't block it; a board
  // resting on stones or on a live animal does block (Mishnah Oholot 6:1;
  // Rambam Tumat Met 18:3: a door held shut by a person doesn't block)
  function coverBlocks(heldBy) {
    const blocks = heldBy === 'stones' || heldBy === 'animal' || heldBy === 'itself';
    return { blocks, src: 'Mishnah Oholot 6:1; Rambam, Tumat Met 18:3' };
  }

  // Is a spot under a cover that also covers a met or grave?
  function underSameOhel(coverReachesSpot, coverReachesTumah, cover = {}) {
    const c = ohelCover(cover);
    return { result: c.brings && coverReachesSpot && coverReachesTumah, src: 'Rambam, Tumat Met 1:10, 13:2' };
  }

  // ---------- 5. Beit HaPeras ----------
  // field: 'plowed' (a grave was plowed) | 'lost' (a grave was lost in it)
  // method: 'walk' | 'blow' | 'stones' | 'ride' | 'trodden'
  // opts: { solid, strong } for stones / ride
  // purpose: 'pesach' | 'mitzvah' | 'terumah' | 'mikdash'
  // Returns { tahor, reason, src }
  function crossField({ field, method, solid, strong, purpose }) {
    if (field === 'lost') {
      // A whole grave conveys by ohel, so passing over it in any way is tamei
      return { tahor: false, reason: 'ohel', src: 'Mishnah Oholot 18:3; Rambam, Tumat Met 10:10' };
    }
    if (field !== 'plowed') throw new Error('Unknown field: ' + field);
    switch (method) {
      case 'walk':
        return { tahor: false, reason: 'touch', src: 'Rambam, Tumat Met 10:2' };
      case 'stones':
        return solid
          ? { tahor: true, src: 'Rambam, Tumat Met 10:11' }
          : { tahor: false, reason: 'wobbly', src: 'Rambam, Tumat Met 10:11' };
      case 'ride':
        return strong
          ? { tahor: true, src: 'Rambam, Tumat Met 10:11' }
          : { tahor: false, reason: 'weak', src: 'Rambam, Tumat Met 10:11' };
      case 'blow':
        // "מנפח אדם בית הפרס והולך" (Berakhot 19b), even a Kohen (Rambam Eruvin 6:17),
        // and he brings his Pesach (Korban Pesach 6:8). Not relied on for terumah
        // ("אין בודקין לתרומה", Oholot 18:4), nor for anything holier.
        if (purpose === 'terumah' || purpose === 'mikdash') {
          return { tahor: false, reason: 'notForTerumah', src: 'Mishnah Oholot 18:4; Rashi, Berakhot 19b' };
        }
        return { tahor: true, src: 'Berakhot 19b; Rambam, Eruvin 6:17; Korban Pesach 6:8' };
      case 'trodden':
        // A trodden Beit HaPeras is tahor for the one bringing the Pesach (Korban Pesach 6:8)
        if (purpose === 'pesach') return { tahor: true, src: 'Rambam, Korban Pesach 6:8' };
        return { tahor: false, reason: 'onlyPesach', src: 'Rambam, Korban Pesach 6:8' };
      default:
        throw new Error('Unknown method: ' + method);
    }
  }

  // A marked field of unknown kind: trees = plowed grave, no trees = lost grave
  // (Rambam Tumat Met 10:10, 8:10)
  function markedFieldKind(hasTrees) {
    return { field: hasTrees ? 'plowed' : 'lost', src: 'Rambam, Tumat Met 10:10' };
  }

  // ---------- 6. Lime markings ----------
  // Marks go a little beyond the tumah (so taharot aren't lost) but not far
  // (so the land isn't lost) (Rambam Tumat Met 8:9). The game picks the band.
  const LIME_BAND = { min: 0.06, max: 0.4 }; // extra size, as a fraction of the tumah's size
  function limeMark(markSize, tumahSize) {
    const extra = markSize / tumahSize - 1;
    if (extra < LIME_BAND.min) return { result: 'tooTight', src: 'Rambam, Tumat Met 8:9' };
    if (extra > LIME_BAND.max) return { result: 'tooWide', src: 'Rambam, Tumat Met 8:9' };
    return { result: 'ok', src: 'Rambam, Tumat Met 8:9' };
  }

  // Reading marks on a 3x3 field (cells 0-8, row by row; edges 0 top, 1 right,
  // 2 bottom, 3 left) (Rambam Tumat Met 8:11). Returns { tamei: cells, edges }.
  // pattern: 'oneStone' {cell} | 'twoStonesLimeBetween' {row} |
  //          'twoStonesSherdsBetween' {row} | 'twoStonesLimeOnTop' {row} |
  //          'fourEdges' | 'oneEdge' {edge}
  function readMarks(pattern, opts = {}) {
    const src = 'Rambam, Tumat Met 8:11';
    const row = r => [r * 3, r * 3 + 1, r * 3 + 2];
    switch (pattern) {
      case 'oneStone': return { tamei: [opts.cell], edges: [], src };            // "תחתיה טמא"
      case 'twoStonesLimeBetween': return { tamei: row(opts.row), edges: [], src }; // "ביניהן טמא"
      case 'twoStonesSherdsBetween': return { tamei: [], edges: [], src };      // lime on top, sherd between: "אין זה אלא בניין"
      case 'twoStonesLimeOnTop': return { tamei: row(opts.row), edges: [], src }; // lime spread on top, no sherd: "הרי זה ציון וטמא"
      case 'fourEdges': return { tamei: [0, 1, 2, 3, 4, 5, 6, 7, 8], edges: [], src }; // edges tahor, whole field tamei
      case 'oneEdge': return { tamei: [], edges: [opts.edge], src };            // the edge is tamei, the field tahor
      default: throw new Error('Unknown pattern: ' + pattern);
    }
  }

  // Which places get a lime mark? Only doubtful ones: a field where a grave
  // was lost, branches and jutting stones over a grave. Not well-known graves,
  // and not an exact k'zayit, which will shrink in the ground (Rambam Tumat Met 8:9)
  function shouldMark(kind) {
    const src = 'Rambam, Tumat Met 8:9';
    if (kind === 'lostGrave' || kind === 'branches' || kind === 'juttingStone') return { mark: true, src };
    if (kind === 'knownCemetery') return { mark: false, reason: 'known', src };
    if (kind === 'kzayit') return { mark: false, reason: 'shrinks', src };
    throw new Error('Unknown place: ' + kind);
  }

  // ---------- Mikveh ----------
  // Rainwater gathered by itself is a kosher mikveh; drawn water (שאובין) is
  // invalid by Rabbinic law (Rambam Mikvaot 4:1-2)
  function mikveh({ drawn }) {
    return drawn ? { valid: false, level: 'derabbanan', src: 'Rambam, Mikvaot 4:2' } : { valid: true, src: 'Rambam, Mikvaot 4:1' };
  }

  // ---------- 7. Vessels in an ohel with a met (tzamid patil) ----------
  // material: 'clay' | 'stone' | 'metal' ; sealed: tightly sealed (צמיד פתיל)
  // item: 'oil' / 'food' (food or drink) | 'clay' | 'metal' | 'stone'
  const NEVER_TAMEI = { stone: true }; // also dung and earth vessels (Rambam Kelim 1:6)
  function vesselInOhel({ material, sealed }) {
    if (NEVER_TAMEI[material]) return { tahor: true, src: 'Mishnah Kelim 10:1; Rambam, Kelim 1:6' };
    if (material === 'clay') return { tahor: !!sealed, src: 'Bamidbar 19:15; Rambam, Tumat Met 21:1' };
    return { tahor: false, src: 'Rambam, Tumat Met 21:1' }; // metal: tamei, sealed or not
  }

  // A clay vessel becomes tamei only through its inside (or a zav moving it),
  // never by being touched on the outside (Rambam Kelim 13:1)
  function clayTouchedOutside() {
    return { tahor: true, src: 'Rambam, Kelim 13:1' };
  }

  function itemInOhel({ item, vessel }) {
    const src = 'Mishnah Kelim 10:1; Rambam, Tumat Met 21:1';
    if (NEVER_TAMEI[item]) return { tahor: true, src };
    if (!vessel || !vessel.sealed) return { tahor: false, src };
    if (NEVER_TAMEI[vessel.material]) return { tahor: true, src };        // stone saves everything
    if (vessel.material === 'clay') {                                      // clay saves food, drink and clay only
      return { tahor: item === 'oil' || item === 'food' || item === 'clay', src };
    }
    return { tahor: false, src };                                          // metal saves nothing
  }

  // ---------- 8. Liquids and hands ----------
  // Levels: 'tahor', 'av', 1, 2, 3
  // A liquid that touches anything tamei (Av, Rishon or Sheni) becomes Rishon
  // (Rambam She'ar Avot HaTumot 7:5; Parah 8:7)
  function liquidTouches(otherLevel) {
    if (otherLevel === 'tahor' || otherLevel === 3) return { level: 'tahor', src: "Rambam, She'ar Avot HaTumot 7:5" };
    return { level: 1, src: "Rambam, She'ar Avot HaTumot 7:5; Mishnah Parah 8:7" };
  }

  // Hands that weren't washed count as Sheni, by Rabbinic law (She'ar Avot HaTumot ch. 8)
  function hands(washed) {
    return { level: washed ? 'tahor' : 2, src: "Rambam, She'ar Avot HaTumot 8" };
  }

  // ---------- 9. Chanukah ----------
  // A jug of oil after the Greeks were in the Heichal: pure only if it lay
  // sealed with the Kohen Gadol's seal, intact and unmoved (Shabbat 21b and
  // Rashi there: "hidden and sealed... he recognized they hadn't touched it";
  // Tosafot there on moving)
  function jugIsPure({ sealed, intact, moved }) {
    const src = 'Shabbat 21b; Rashi there';
    if (!sealed) return { pure: false, reason: 'noSeal', src };
    if (!intact) return { pure: false, reason: 'broken', src };
    if (moved) return { pure: false, reason: 'moved', src: 'Shabbat 21b, Tosafot there' };
    return { pure: true, src };
  }

  // For the whole community, tumah is only pushed aside (דחויה), so first
  // search for a pure way (Rambam Bi'at HaMikdash 4:15)
  function communityTumah() {
    return { status: 'dechuya', mustSearchFirst: true, src: "Rambam, Bi'at HaMikdash 4:15" };
  }

  return {
    conveys, moveViaPlank, passOver,
    kohenMay, kohenDistanceOk, MET_DISTANCE_AMOT,
    personTouches, personMovesWithStick, canEatTerumah,
    ohelCover, underSameOhel,
    crossField, markedFieldKind,
    LIME_BAND, limeMark, readMarks, shouldMark, mikveh, coverBlocks,
    vesselInOhel, itemInOhel, clayTouchedOutside,
    liquidTouches, hands,
    jugIsPure, communityTumah,
  };
})();

    {id:'1-1',type:'bridge',title:B('A small first step','צעד ראשון'),goal:B('Eli is on his way to Jerusalem. Pull the golden pin to lower the bridge, then send him across.','אלי בדרך לירושלים. משכו את יתד הזהב כדי להוריד את הגשר, ואז שלחו אותו לדרך.'),hint:B('The round golden handle opens the bridge.','ידית הזהב העגולה פותחת את הגשר.'),why:B('You cleared Eli’s first crossing! Golden pins change the world. Look first, change the path, then let Eli walk. In the coming puzzles, the route will also depend on the laws of tumah and taharah.','פתחתם לאלי את המעבר הראשון! יתדות הזהב משנות את הדרך. קודם מסתכלים, אחר כך משנים, ורק אז שולחים את אלי. בהמשך תצטרכו גם להכיר את דיני הטומאה והטהרה.'),sources:[],initial:{bridge:false},actions:[['pin',B('Pull the pin','משכו את היתד')],['go',B('Let’s go →','לדרך ←')]],solution:['pin','go'],act(s,a){if(a==='pin'){s.bridge=true;return 'change'}if(a==='go')return s.bridge?'win':'blocked'}},

    {id:'1-3',type:'bone',title:B('The quiet crossing','המעבר השקט'),goal:B('A small bone lies on a loose plank. Choose a route that won’t touch or move it.','עצם קטנה מונחת על קרש רופף. בחרו דרך שלא תיגע בעצם ולא תזיז אותה.'),hint:B('The high stone arch never touches the loose plank.','קשת האבן הגבוהה אינה נוגעת בקרש הרופף.'),why:B('Even a bone the size of a barley grain conveys tumah by touch or by moving it. Moving the plank beneath it counts. This single bone does not convey tumah through ohel, so the separate arch is safe.','אפילו עצם כשעורה מטמאה במגע ובמשא. גם הזזת הקרש שמתחתיה נחשבת היסט. עצם יחידה זו אינה מטמאה באוהל, ולכן הקשת הנפרדת בטוחה.'),sources:[source('Rambam · Tumat Met 2:10','Mishneh_Torah,_Defilement_by_a_Corpse.2.10'),source('Rambam · Tumat Met 1:7','Mishneh_Torah,_Defilement_by_a_Corpse.1.7')],initial:{route:null},actions:[['arch',B('Stone arch','קשת האבן')],['plank',B('Loose plank','הקרש הרופף')],['go',B('Let’s go →','לדרך ←')]],solution:['arch','go'],act(s,a){if(a!=='go'){s.route=a;return 'change'}if(!s.route)return 'blocked';return (s.route==='arch'?!Tumah.passOver('bone').result:!Tumah.moveViaPlank('bone').result)?'win':'fail'},failure:B('The plank moved the bone. Choose the separate stone arch.','הקרש הזיז את העצם. בחרו בקשת האבן הנפרדת.')},

ow);return 'change'}if(a==='go'){if(s.checked<4||s.path.length<4)return 'blocked';return Tumah.crossField({field:'plowed',method:'blow',purpose:'mitzvah'}).tahor?'win':'fail'}}},
    {id:'1-7',type:'marks',title:B('Leave a little room','השאירו קצת מקום'),goal:B('The old lime mark washed away. Mark the doubtful grave area with a small margin, without closing the whole road.','סימון הסיד נשטף. סמנו את שטח הספק עם מרווח קטן, בלי לחסום את כל הדרך.'),hint:B('The middle outline leaves a little space beyond the area.','הקו האמצעי משאיר מעט מרווח מעבר לשטח.'),why:B('Lime marks extend a little beyond a doubtful area of tumah, so passersby keep clear. They should not be too close or unnecessarily far away. The outlines here illustrate that principle; they are not halachic measurements.','מרחיבים מעט את סימון הסיד מעבר למקום הטומאה שבספק, כדי להזהיר את העוברים. אין לצמצם מדי ואין להרחיב ללא צורך. הקווים במשחק ממחישים את העיקרון ואינם מידות הלכתיות.'),sources:[source('Rambam · Tumat Met 8:9','Mishneh_Torah,_Defilement_by_a_Corpse.8.9')],initial:{mark:null},actions:[['tight',B('Close outline','סימון צמוד')],['margin',B('Small margin','מרווח קטן')],['wide',B('Wide outline','סימון רחב')],['go',B('Paint the mark','צבעו בסיד')]],solution:['margin','go'],act(s,a){if(a!=='go'){s.mark=a;return 'change'}if(!s.mark)return 'blocked';return Tumah.limeMark({tight:100,margin:120,wide:170}[s.mark],100).result==='ok'?'win':'fail'},failure:B('Give the area a small margin. Don’t crowd it or close off extra land.','השאירו מרווח קטן. אל תצמצמו מדי ואל תחסמו שטח נוסף.')},
    {id:'1-8',type:'lost',title:B('The road around','הדרך מסביב'),goal:B('This time a whole grave was lost in the field. A blower cannot help. Find another way.','הפעם אבד בשדה קבר שלם. ניפוח העפר אינו מועיל. מצאו דרך אחרת.'),hint:B('Follow the road outside the marked field.','בחרו בדרך שמחוץ לשדה המסומן.'),why:B('A whole grave can convey tumah through ohel. Blowing away loose soil cannot solve that problem. This is different from a field containing only scattered bone fragments; Eli takes the road outside the field.','קבר שלם מטמא גם באוהל. ניפוח העפר אינו פותר את הבעיה. שלא כמו שדה עם שברי עצמות מפוזרים, כאן אלי הולך בדרך שמחוץ לשדה.'),sources:[source('Mishnah Oholot 18:3','Mishnah_Oholot.18.3')],initial:{route:null},actions:[['field',B('Blow & cross','נפחו ועברו')],['detour',B('Road around','הדרך מסביב')],['go',B('Let’s go →','לדרך ←')]],solution:['detour','go'],act(s,a){if(a!=='go'){s.route=a;return 'change'}if(!s.route)return 'blocked';return s.route==='detour'||Tumah.crossField({field:'lost',method:'blow',purpose:'mitzvah'}).tahor?'win':'fail'},failure:B('A lost whole grave can convey tumah above it. Take the outside road.','קבר שלם שאבד יכול לטמא את המאהיל עליו. בחרו בדרך החיצונית.')},
    {id:'1-9',type:'sunset',title:B('Wait for the stars','מחכים לכוכבים'),goal:B('After touching a sheretz, Eli needs immersion and nightfall before terumah. Choose the rain-fed mikveh, then wait.','אלי נגע בשרץ. כדי לאכול תרומה עליו לטבול ולהמתין לערב. בחרו במקווה מי הגשמים ואז המתינו.'),hint:B('Rainwater, immersion, then nightfall. A bucket-filled pool won’t work.','מי גשמים, טבילה ואז צאת הכוכבים. בריכה שמולאה בדליים אינה מועילה.'),why:B('A person who became tamei from a sheretz needs immersion and nightfall before eating terumah. The mikveh here is filled by rainwater gathering naturally; the bucket-filled pool contains drawn water.','מי שנטמא משרץ צריך טבילה והערב שמש לפני אכילת תרומה. המקווה כאן מתמלא ממי גשמים הנקווים מעצמם; בבריכת הדליים יש מים שאובים.'),sources:[source('Vayikra 22:6–7','Leviticus.22.6-7'),source('Rambam · Mikvaot 4:2','Mishneh_Torah,_Immersion_Pools.4.2')],initial:{immersed:false,night:false},actions:[['rain',B('Rain-fed mikveh','מקווה מי גשמים')],['bucket',B('Bucket-filled pool','בריכת דליים')],['wait',B('Wait for night','חכו לערב')],['go',B('Eat terumah','אכלו תרומה')]],solution:['rain','wait','go'],act(s,a){if(a==='rain'||a==='bucket'){if(!Tumah.mikveh({drawn:a==='bucket'}).valid)return 'fail';s.immersed=true;return 'change'}if(a==='wait'){s.night=true;return 'change'}if(a==='go')return Tumah.canEatTerumah({status:'rishon',immersed:s.immersed,starsOut:s.night}).ok?'win':'fail'},failure:B('Eli needs both immersion in a valid mikveh and nightfall before terumah.','אלי צריך גם טבילה במקווה כשר וגם הערב שמש לפני אכילת תרומה.')},
    {id:'1-10',type:'finale',title:B('Jerusalem, at last','סוף סוף ירושלים'),goal:B('One last plowed-grave field. Eli carries terumah, so blowing is not enough. Choose the strong donkey.','עוד בית הפרס אחד. אלי נושא תרומה, ולכן ניפוח אינו מספיק. בחרו בחמור החזק.'),hint:B('The strong donkey carries Eli across without shifting the soil beneath his feet.','החמור החזק נושא את אלי בלי שרגליו יזיזו את הקרקע.'),why:B('Blowing and checking a plowed-grave field is not relied on for terumah. A strong animal that will not throw its rider is another permitted way across. Eli has reached Jerusalem—and learned why the details matter.','אין בודקים בית הפרס לתרומה בניפוח. בהמה חזקה שאינה מטילה את הרוכב היא דרך אחרת לעבור. אלי הגיע לירושלים ולמד מדוע הפרטים חשובים.'),sources:[field,source('Mishnah Oholot 18:4','Mishnah_Oholot.18.4')],initial:{route:null},actions:[['blow',B('Blow the soil','נפחו את העפר')],['donkey',B('Strong donkey','חמור חזק')],['go',B('To Jerusalem →','לירושלים ←')]],solution:['donkey','go'],act(s,a){if(a!=='go'){s.route=a;return 'change'}if(!s.route)return 'blocked';return Tumah.crossField({field:'plowed',method:s.route==='donkey'?'ride':'blow',strong:true,purpose:'terumah'}).tahor?'win':'fail'},failure:B('Blowing is not relied on for terumah. Choose the strong donkey for this crossing.','אין מסתמכים על ניפוח לתרומה. בחרו בחמור החזק למעבר הזה.')},
    {id:'C-1',type:'search',title:B('First, we search','קודם מחפשים'),goal:B('Yehuda is helping prepare the Mikdash. Before using impure oil, search the storeroom for pure oil.','יהודה עוזר להכין את המקדש. לפני שמשתמשים בשמן טמא, חפשו במחסן שמן טהור.'),hint:B('Light the lantern and look through all three shelves.','הדליקו את העששית וחפשו בכל שלושת המדפים.'),why:B('For communal service, tumah is pushed aside when necessary, but one first seeks a pure way. That is why the search for pure oil matters.','בעבודת הציבור הטומאה דחויה בעת הצורך, אך קודם מחפשים דרך לעשות בטהרה. לכן החיפוש אחר שמן טהור חשוב.'),sources:[source('Rambam · Biat HaMikdash 4:15','Mishneh_Torah,_Admission_into_the_Sanctuary.4.15')],initial:{searched:0},actions:[['search',B('Search a shelf','חפשו במדף')],['go',B('Finish the search','סיימו את החיפוש')]],solution:['search','search','search','go'],act(s,a){if(a==='search'){s.searched=Math.min(3,s.searched+1);return 'change'}if(a==='go')return Tumah.communityTumah().mustSearchFirst&&s.searched<3?'blocked':'win'}},
    {id:'C-2',type:'jugs',title:B('The hidden jug','הפך הנסתר'),goal:B('Three jugs, three stories. Inspect them and find the one with an intact seal that has not been moved.','שלושה פכים, שלושה סיפורים. בדקו ומצאו את הפך שחתימתו שלמה ולא הוזז.'),hint:B('The middle jug has an intact seal and undisturbed dust around it.','לפך האמצעי חתימה שלמה והאבק סביבו לא הוזז.'),why:B('The Chanukah account tells of one jug bearing the Kohen Gadol’s seal. In this puzzle, an intact seal and undisturbed position identify the protected jug, following the interpretation used in the original research.','בסיפור חנוכה נמצא פך אחד בחותמו של כהן גדול. במשחק חתימה שלמה ומקום שלא הופרע מזהים את הפך השמור, לפי הפירוש שנבחר במחקר המקורי.'),sources:[source('Shabbat 21b · Rashi and Tosafot','Shabbat.21b')],initial:{jug:null},actions:[['left',B('Broken seal','חותם שבור')],['middle',B('Intact & undisturbed','שלם ולא הוזז')],['right',B('Moved jug','פך שהוזז')],['go',B('Choose this jug','בחרו בפך')]],solution:['middle','go'],act(s,a){if(a!=='go'){s.jug=a;return 'change'}if(!s.jug)return 'blocked';return Tumah.jugIsPure({sealed:true,intact:s.jug!=='left',moved:s.jug==='right'}).pure?'win':'fail'},failure:B('Check both the seal and whether the jug was moved.','בדקו גם את החותם וגם אם הפך הוזז.')},
    {id:'C-3',type:'seal',title:B('Sealed tight','סגור היטב'),goal:B('Oil in a clay jar needs protection in an ohel with a met. Fit the lid and seal it tightly.','שמן בכלי חרס זקוק להגנה באוהל המת. התאימו מכסה ואטמו אותו היטב.'),hint:B('A lid resting on top is not a tight seal. Fit it, then add the seal.','מכסה שמונח למעלה אינו צמיד פתיל. הניחו ואז אטמו.'),why:B('A tightly sealed clay vessel protects the oil inside it in an ohel with a met. An open vessel, or one with a loose lid, does not provide this protection. This is tzamid patil.','כלי חרס המוקף צמיד פתיל מציל את השמן שבתוכו באוהל המת. כלי פתוח או מכסה רופף אינם מגינים כך. זהו דין צמיד פתיל.'),sources:[seal],initial:{lid:false,sealed:false},actions:[['lid',B('Fit the lid','התאימו מכסה')],['seal',B('Seal the rim','אטמו את השפה')],['go',B('Check the oil','בדקו את השמן')]],solution:['lid','seal','go'],act(s,a){if(a==='lid'){s.lid=true;return 'change'}if(a==='seal'){if(!s.lid)return 'blocked';s.sealed=true;return 'change'}if(a==='go')return Tumah.itemInOhel({item:'oil',vessel:{material:'clay',sealed:s.sealed}}).tahor?'win':'fail'},failure:B('A loose lid is not enough. Fit the lid and seal the rim tightly.','מכסה רופף אינו מספיק. התאימו את המכסה ואטמו היטב.')},
    {id:'C-4',type:'vessels',title:B('More than a pretty cup','לא רק כלי יפה'),goal:B('Which vessel stays tahor in an ohel with a met? Compare an open clay jar, a stone cup, and a sealed metal jug.','איזה כלי נשאר טהור באוהל המת? השוו כלי חרס פתוח, כוס אבן וכלי מתכת סגור.'),hint:B('Stone vessels do not become tamei. A seal does not protect a metal vessel.','כלי אבן אינם מקבלים טומאה. חותם אינו מציל כלי מתכת.'),why:B('Stone vessels do not become tamei. An open clay vessel becomes tamei in an ohel with a met; sealing a metal vessel does not protect it. Material matters.','כלי אבן אינם מקבלים טומאה. כלי חרס פתוח נטמא באוהל המת, וחותם אינו מגן על כלי מתכת. החומר שממנו עשוי הכלי משנה.'),sources:[source('Rambam · Kelim 1:6','Mishneh_Torah,_Vessels.1.6'),seal],initial:{vessel:null},actions:[['clay',B('Open clay','חרס פתוח')],['stone',B('Stone cup','כוס אבן')],['metal',B('Sealed metal','מתכת סגורה')],['go',B('Choose the vessel','בחרו בכלי')]],solution:['stone','go'],act(s,a){if(a!=='go'){s.vessel=a;return 'change'}if(!s.vessel)return 'blocked';return Tumah.vesselInOhel({material:s.vessel,sealed:s.vessel==='metal'}).tahor?'win':'fail'},failure:B('This vessel becomes tamei here. Try a material that does not receive tumah.','הכלי הזה נטמא כאן. נסו חומר שאינו מקבל טומאה.')},
    {id:'C-5',type:'oil',title:B('Keep the oil pure','שומרים על השמן'),goal:B('The oil is tahor. Wash Yehuda’s hands before pouring it into the lamp.','השמן טהור. רחצו את ידיו של יהודה לפני מזיגתו לנר.'),hint:B('Unwashed hands have the status of sheni. Liquids have a special rule.','ידיים שלא ניטלו הן שניות. למשקים יש דין מיוחד.'),why:B('Unwashed hands are treated as sheni by Rabbinic law. Liquid that touches a sheni becomes rishon. Washing the hands before handling the oil preserves its tahor status in this puzzle.','סתם ידיים הן שניות מדברי סופרים. משקה הנוגע בשני נעשה ראשון לטומאה. נטילת ידיים לפני הטיפול בשמן שומרת כאן על טהרתו.'),sources:[source('Rambam · Shear Avot HaTumot 7:5','Mishneh_Torah,_Other_Sources_of_Defilement.7.5')],initial:{washed:false},actions:[['wash',B('Wash hands','טלו ידיים')],['go',B('Pour the oil','מזגו את השמן')]],solution:['wash','go'],act(s,a){if(a==='wash'){s.washed=true;return 'change'}if(a==='go')return Tumah.liquidTouches(Tumah.hands(s.washed).level).level==='tahor'?'win':'fail'},failure:B('Unwashed hands make the oil tamei. Wash before pouring.','ידיים שלא ניטלו מטמאות את השמן. טלו ידיים לפני המזיגה.')},
    {id:'C-6',type:'lamps',title:B('A little light','מעט אור'),goal:B('The pure oil is ready. Light the seven lamps of the Mikdash menorah. Remember the miracle of eight days.','השמן הטהור מוכן. הדליקו את שבעת נרות המנורה במקדש וזכרו את נס שמונת הימים.'),hint:B('Tap each of the seven lamps, or use the light button.','הקישו על כל אחד משבעת הנרות או השתמשו בכפתור ההדלקה.'),why:B('The menorah in the Mikdash has seven lamps. The Chanukah account tells how oil sufficient for one day lasted eight days. A Chanukah lamp used at home commemorates those eight days; it is different from the seven-branched Mikdash menorah.','למנורת המקדש שבעה נרות. בסיפור חנוכה השמן שהיה מספיק ליום אחד דלק שמונה ימים. נרות החנוכה בבית מזכירים את שמונת הימים, והם שונים ממנורת המקדש בעלת שבעת הקנים.'),sources:[source('Shabbat 21b','Shabbat.21b'),source('Shemot 25:37','Exodus.25.37')],initial:{lit:[]},actions:[['light',B('Light the next lamp','הדליקו את הנר הבא')],['go',B('Celebrate →','חוגגים ←')]],solution:[...Array(7).fill('light'),'go'],act(s,a){if(a.startsWith('lamp')){const n=Number(a.slice(4));if(!s.lit.includes(n))s.lit.push(n);return 'change'}if(a==='light'){const n=[0,1,2,3,4,5,6].find(n=>!s.lit.includes(n));if(n!==undefined)s.lit.push(n);return 'change'}if(a==='go')return s.lit.length===7?'win':'blocked'}}
  ];
  return levels.map((l,i)=>({...l,index:i,pack:i<10?'road':'light'}));
})();
if(typeof module!=='undefined')module.exports=TeharaLevels;
</script><script>/* Original SVG illustration kit. No remote assets or GPU required. */
const TeharaArt = (()=>{
 const defs=`<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dfece3"/><stop offset="1" stop-color="#f2edcf"/></linearGradient><linearGradient id="night" x2="0" y2="1"><stop stop-color="#233e4b"/><stop offset="1" stop-color="#6a8277"/></linearGradient><linearGradient id="earth" x2="0" y2="1"><stop stop-color="#bdba88"/><stop offset="1" stop-color="#999873"/></linearGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#eddfb6"/><stop offset="1" stop-color="#cbbb8f"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f5d88a"/><stop offset=".5" stop-color="#d5a34c"/><stop offset="1" stop-color="#b78435"/></linearGradient><linearGradient id="robe" x2="1" y2="0"><stop stop-color="#e9e8d5"/><stop offset=".55" stop-color="#fffef1"/><stop offset="1" stop-color="#d9d9c2"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffdf85" stop-opacity=".6"/><stop offset="1" stop-color="#ffdf85" stop-opacity="0"/></radialGradient><pattern id="blocks" width="70" height="36" patternUnits="userSpaceOnUse"><rect width="70" height="36" fill="url(#stone)"/><path d="M0 0H70M0 36H70M35 0V18M0 18H70M0 18V36M70 18V36" fill="none" stroke="#b2a77b" stroke-opacity=".35" stroke-width="1.5"/></pattern><filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2d4430" flood-opacity=".14"/></filter><filter id="soft"><feGaussianBlur stdDeviation="10"/></filter></defs>`;
 const svg=(body,box='0 0 800 600',label='')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${box}" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${defs}${body}</svg>`;
 const stone=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#blocks)"/><path d="M${x} ${y}h${w}" stroke="#fff0ca" stroke-width="5"/>`;
 function tree(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="3" rx="67" ry="13" fill="#3b5734" opacity=".1"/><path d="M-11 0L-4-102L-30-142M-4-80L23-126" fill="none" stroke="#8e8760" stroke-width="13" stroke-linecap="round"/><g fill="#83996b"><ellipse cx="-35" cy="-135" rx="46" ry="35"/><ellipse cx="28" cy="-146" rx="47" ry="37"/><ellipse cy="-171" rx="45" ry="35"/></g><g fill="#9bae7c"><ellipse cx="-35" cy="-151" rx="35" ry="25"/><ellipse cx="12" cy="-177" rx="35" ry="25"/></g><g fill="#b6c396" opacity=".7"><ellipse cx="-18" cy="-180" rx="7" ry="3" transform="rotate(-25 -18 -180)"/><ellipse cx="41" cy="-158" rx="8" ry="3" transform="rotate(-25 41 -158)"/><ellipse cx="-58" cy="-137" rx="7" ry="3"/></g></g>`}
 function bush(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})" fill="#81916a"><ellipse rx="30" ry="15"/><circle cx="-15" cy="-12" r="15"/><circle cx="10" cy="-16" r="20"/><path d="M-25 1q20-24 48-7" fill="#99a47a"/></g>`}
 function city(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#shadow)"><path d="M0 0V-61h30v-26h17v-20h18v20h26v-29h22v29h25v-17h22v17h25v-21h25v21h35v87Z" fill="#ddd4ab"/><path d="M30-60V-93h20v-18h14v18h23v-24h22v24h26v-18h18v18h22v-18h20v18h30v33" fill="#eee3ba"/><path d="M0-32h245V0H0Z" fill="url(#blocks)"/><path d="M107 0v-37q16-22 32 0V0" fill="#8b9273"/><path d="M114 0v-32q9-13 18 0V0" fill="#667e62"/><g fill="#9ca283"><path d="M18-44v-12q5-8 10 0v12Z"/><path d="M68-44v-12q5-8 10 0v12Z"/><path d="M167-44v-12q5-8 10 0v12Z"/><path d="M215-44v-12q5-8 10 0v12Z"/></g><path d="M70-118h94v12H70Z" fill="#d4c399"/><path d="M82-153h70v36H82Z" fill="#e9dcaf"/><path d="M76-154h83l-8-7H84Z" fill="#dbc898"/><path d="M90-145h8v27h-8m17-27h8v27h-8m17-27h8v27h-8m15-27h8v27h-8" fill="#bcae80"/></g>`}

 function jar(x,y,s=1,material='clay',sealed=false,broken=false){const c=material==='stone'?'#c7c9b1':material==='metal'?'#b8b37a':'#c68c60';return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="2" rx="31" ry="7" fill="#2f4431" opacity=".1"/><path d="M-12-67v12q-22 5-23 26-2 32 35 32t35-32q-1-21-23-26v-12Z" fill="${c}" stroke="#766e4833" stroke-width="2"/><path d="M-20-47q-10 17-5 34" stroke="#fff4d5" stroke-opacity=".35" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M23-52q22-5 22 10t-13 16" fill="none" stroke="${c}" stroke-width="7"/><ellipse cy="-67" rx="15" ry="5" fill="#7e7050"/>${sealed?`<path d="M-17-72h34v9h-34Z" fill="#d9b984"/><path d="M-17-63h34" stroke="#e2cf9f" stroke-width="6"/><circle cy="-61" r="9" fill="#a76748"/><path d="M-4-61h8m-4-4v8" stroke="#e3bf81" stroke-width="1.5"/>`:''}${broken?'<path d="M-1-70l5 5-8 5 6 5" stroke="#eee6c8" stroke-width="4" fill="none"/>':''}</g>`}
 function bone(x,y,s=1){return `<g transform="translate(${x} ${y}) rotate(-20) scale(${s})" fill="#eee6cf" stroke="#b9ae93" stroke-width="1"><path d="M-15-4q-10-12-14-4-4 5 3 9-7 8 1 11 5 2 10-8h30q9 11 14 4 5-6-3-9 6-8-1-11-6-2-10 8Z"/></g>`}
 const label=(text,x,y,dark=false)=>`<g pointer-events="none"><rect x="${x-65}" y="${y-15}" width="130" height="30" rx="15" fill="${dark?'#fff8e4':'#f7f5e9'}" opacity=".9"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#66785c">${text}</text></g>`;

 function scene(l,s,L,won=false,busy=false){
  const night=l.pack==='light'||(l.type==='sunset'&&s.night);let body=background(night),actor=true;
  const txt=(en,he)=>L({en,he});

  if(l.type==='bridge')body+=`<path d="M0 430H280V600H0ZM520 430H800V600H520Z" fill="url(#earth)"/><path d="M0 430H280M520 430H800" stroke="#7f996c" stroke-width="14"/><path d="M288 600q30-60 120-45t100 45" fill="#9dbcb0"/><path d="M283 430v170M517 430v170" stroke="#a6a57c" stroke-width="6"/><g transform="translate(280 428) rotate(${s.bridge?0:-75})" style="transition:transform .55s"><rect width="240" height="19" rx="3" fill="#b99a65"/><path d="M10 3h220M20 3v15m30-15v15m30-15v15m30-15v15m30-15v15m30-15v15m30-15v15" stroke="#e0bf83" stroke-width="3"/></g>${!s.bridge?pin(280,345,'pin',txt('Pull the bridge pin','משכו את יתד הגשר')):label(txt('Ready to cross','אפשר לעבור'),402,350)}${tree(665,435,.8)}${label(txt('Jerusalem →','← ירושלים'),672,340)}`;
  else if(l.type==='roof')body+=`${stone(0,430,800,170)}<rect x="260" y="260" width="225" height="170" fill="#6c7964"/>${grave(365,427)}<path d="M240 260v170m265-170v170" stroke="#a58e64" stroke-width="15"/><g style="transform:translateX(${s.roof?0:-245}px);transition:transform .6s"><path d="M230 253h450l-25-32H250Z" fill="#b99d6b"/><path d="M250 235h395" stroke="#dfc68b" stroke-width="4"/></g>${s.roof?'<rect x="260" y="265" width="415" height="161" fill="#b29bc0" opacity=".23"/>':''}${pin(600,200,'roof',txt('Slide the awning','הזיזו את הגגון'))}${label(txt('Burial chamber','חדר קבורה'),365,474)}${label(txt('The crossing','המעבר'),610,474)}`;
  else if(l.type==='bone')body+=`${stone(0,450,235,150)}${stone(565,450,235,150)}<path d="M230 450q170-245 340 0" fill="none" stroke="#d7c79c" stroke-width="42"/><path d="M230 430q170-245 340 0" fill="none" stroke="#f0dfb5" stroke-width="4"/><rect x="230" y="468" width="345" height="15" rx="4" fill="#a99062"/>${bone(400,461,.8)}${click('arch',txt('Choose stone arch','בחרו בקשת האבן'),`<path class="interactive" d="M235 400q165-175 330 0" fill="none" stroke="${s.route==='arch'?'#ecce82':'transparent'}" stroke-width="38"/>`)}${click('plank',txt('Choose loose plank','בחרו בקרש הרופף'),`<rect class="interactive" x="240" y="449" width="320" height="60" fill="transparent" stroke="${s.route==='plank'?'#ecce82':'transparent'}" stroke-width="3"/>`)}${label(txt('Stone arch','קשת האבן'),400,290)}${label(txt('Loose plank','קרש רופף'),400,525)}`;
  else if(l.type==='tree')body+=`${stone(0,450,800,150)}${grave(348,448)}${tree(220,450,1.45)}<g style="transform:rotate(${s.branch?0:-65}deg);transform-origin:220px 240px;transition:transform .6s"><path d="M220 240q140-25 390 20" fill="none" stroke="#8e8760" stroke-width="17"/><ellipse cx="455" cy="238" rx="145" ry="37" fill="#8da174"/></g>${s.branch?'<rect x="295" y="280" width="340" height="168" fill="#aa8fba" opacity=".2"/>':''}${pin(588,210,'branch',txt('Move the branch','הרחיקו את הענף'))}${label(txt('The path','הדרך'),610,495)}`;
  else if(['stones','field','lost','finale'].includes(l.type)){
    body+=`<path d="M215 326h400l55 220H170Z" fill="#b3a47b" stroke="#e8e4c4" stroke-width="5" stroke-dasharray="12 9"/>${label(l.type==='lost'?txt('Lost whole grave','קבר שלם שאבד'):txt('Plowed-grave field','בית הפרס שנחרש'),414,300)}`;
    if(l.type==='stones'){for(let r=0;r<2;r++){body+=click(r?'lower':'upper',txt(r?'Lower stones':'Upper stones',r?'אבנים תחתונות':'אבנים עליונות'),Array.from({length:5},(_,i)=>`<g transform="translate(${245+i*72} ${385+r*105}) rotate(${s.tested&&!r?(i%2?8:-8):0})"><ellipse class="interactive" rx="27" ry="16" fill="${s.route===(r?'lower':'upper')?'#eddb9d':'#d0cfb6'}" stroke="#a1a687" stroke-width="3"/><path d="M-20-6q20-12 40 0" stroke="#eeebd2" stroke-width="3" fill="none"/></g>`).join(''));}if(s.tested)body+=`${label(txt('Wobbly','מתנדנדות'),710,385)}${label(txt('Steady','יציבות'),710,490)}`;}
    if(l.type==='field'){for(let i=0;i<4;i++){for(let r=0;r<3;r++){const x=255+i*98,y=365+r*65,clear=i<s.checked,hasBone=[[0,1],[2],[0],[2]][i].includes(r);body+=click('step:'+i+':'+r,txt('Step '+(i+1)+', row '+(r+1),'צעד '+(i+1)+', שורה '+(r+1)),`<rect class="interactive" x="${x-40}" y="${y-27}" width="80" height="54" rx="15" fill="${s.path[i]===r?'#d5ddb2':clear?'#d9cba1':'#a49972'}" stroke="${s.path[i]===r?'#69835c':'#b7ad85'}" stroke-width="3"/>${clear&&hasBone?bone(x,y,.4):''}${s.path[i]===r?`<path d="M${x-10} ${y}l7 7 14-17" stroke="#6c865d" stroke-width="4" fill="none"/>`:''}`)}}body+=label(s.checked<4?`${s.checked} / 4`:txt('Choose each step →','בחרו כל צעד →'),420,555);}

    if(l.type==='finale')body+=`${donkey(485,480,1.1)}${s.route==='donkey'?label(txt('Ready for Eli','מוכן לאלי'),480,315):''}`;

  }
  else if(l.type==='marks'){body+=`${stone(0,490,800,110)}${grave(410,445)}${[1,1.2,1.7].map((v,i)=>click(['tight','margin','wide'][i],txt(['Close outline','Small margin','Wide outline'][i],['סימון צמוד','מרווח קטן','סימון רחב'][i]),`<ellipse class="interactive" cx="410" cy="440" rx="${85*v}" ry="${47*v}" fill="none" stroke="${s.mark===['tight','margin','wide'][i]?'#fff9d8':'#e7e8d0'}" stroke-width="${s.mark===['tight','margin','wide'][i]?8:3}" stroke-dasharray="${s.mark===['tight','margin','wide'][i]?'0':'6 7'}"/>`)).join('')}${jar(670,480,.9,'stone')}${label(txt('Lime wash','סיד'),675,520)}`}
  else if(l.type==='sunset'){body+=`${stone(0,470,800,130)}<path d="M230 470h150v55H230Z" fill="#90b2a3" stroke="#c7c5a1" stroke-width="10"/><path d="M440 470h150v55H440Z" fill="#90b2a3" stroke="#c7c5a1" stroke-width="10"/><path d="M270 490q20-9 40 0t40 0m110 0q20-9 40 0t40 0" stroke="#c1d5bc" stroke-width="3" fill="none"/>${label(txt('Rainwater','מי גשמים'),305,562)}${label(txt('Drawn water','מים שאובים'),515,562)}<path d="M280 380l-5 16m20-32-5 16m30-2-5 16" stroke="#91b2a7" stroke-width="4" stroke-linecap="round"/><path d="M500 410h33l-5 32h-22Z" fill="#a58d65"/><path d="M503 409q13-30 26 0" stroke="#8e7f5e" fill="none" stroke-width="4"/>${s.immersed?label(txt('Immersed ✓','טבל ✓'),150,320):''}${s.night?label(txt('Nightfall ✓','צאת הכוכבים ✓'),650,150):''}`;}

    if(l.type==='search'){for(let i=0;i<3;i++)body+=`<rect x="270" y="${260+i*70}" width="260" height="12" rx="2" fill="#ab9468"/>${jar(330,260+i*70,.65,'clay',s.searched>i)}${jar(450,260+i*70,.65,'clay',s.searched>i)}${s.searched>i?label('✓',590,240+i*70):''}`;body+=label(`${s.searched} / 3`,400,550);}
    if(l.type==='jugs'||l.type==='vessels'){['left','middle','right'].forEach((a,i)=>{let mat=l.type==='vessels'?['clay','stone','metal'][i]:'clay',action=l.type==='vessels'?mat:a;body+=click(action,txt(['Choose left vessel','Choose middle vessel','Choose right vessel'][i],['בחרו בכלי השמאלי','בחרו בכלי האמצעי','בחרו בכלי הימני'][i]),`<rect class="interactive" x="${210+i*165}" y="290" width="130" height="190" rx="25" fill="${s.jug===a||s.vessel===mat?'#f7de9b22':'transparent'}" stroke="${s.jug===a||s.vessel===mat?'#e4cf8a':'transparent'}" stroke-width="3"/>${jar(275+i*165,468,1.4,mat,l.type==='jugs'||i===2,l.type==='jugs'&&i===0)}${l.type==='jugs'&&i===2?'<path d="M580 479q10-6 28 0m-30 8h20" stroke="#d3c9a4" fill="none" stroke-width="3"/>':''}`)});}

 function finish(){busy=true;won=true;const gen=generation;paint();message(t('A clear path. A new discovery.','דרך פתוחה. תגלית חדשה.'));const actor=$('#board .hero-actor');if(actor){let points=[[120,480],[710,480]];if(level.type==='bridge')points=[[120,428],[710,428]];if(level.type==='roof')points=[[540,428],[740,428]];if(level.type==='tree')points=[[540,448],[740,448]];if(level.type==='bone')points=[[120,445],[235,430],[315,320],[400,295],[485,320],[565,430],[710,445]];if(level.type==='stones')points=[[120,480],[245,state.route==='lower'?490:385],[530,state.route==='lower'?490:385],[710,480]];if(level.type==='lost')points=[[120,480],[170,540],[340,568],[540,568],[710,480]];if(level.type==='field')points=[[120,480],...state.path.map((r,i)=>[255+i*98,365+r*65]),[710,480]];actor.style.transition='none';actor.animate(points.map(([x,y])=>({transform:`translate(${x}px, ${y}px)`})),{duration:1200,fill:'forwards',easing:'ease-in-out'});}const st=Math.max(1,3-(fails?1:0)-(hints?1:0));progress[level.id]=Math.max(progress[level.id]||0,st);save('tehara.v2.stars',progress);setTimeout(()=>{if(gen!==generation)return;audio('win');showWin(st);},matchMedia('(prefers-reduced-motion: reduce)').matches?120:1300)}

 function modal(content,cls=''){focusBefore=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<section class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${t('Tehara information','מידע על טהרה')}"><button class="close" aria-label="${t('Close','סגירה')}">×</button>${content}</section>`;app.append(el);el.querySelector('.close').onclick=closeModal;el.addEventListener('click',e=>{if(e.target===el)closeModal()});el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const nodes=[...el.querySelectorAll('button,a[href]')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});el.querySelector('.close').focus();document.body.style.overflow='hidden'}
