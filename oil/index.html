<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The Last Jug: a Chanukah point-and-click adventure about tumah and taharah, in English and Hebrew.">
<meta name="theme-color" content="#141a2a">
<title>The Last Jug</title>
<link rel="icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500;1,700&family=Alegreya+Sans:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP START-->
<div id="stage"></div>
<div id="veil"></div>
<div id="labels"></div>

<header id="top">
  <div class="place">
    <div class="eyebrow">The Last Jug · test scene</div>
    <h1>Beit Shemaniya <span class="he">לשכת בית שמניה</span></h1>
    <div id="objective">Enter the oil chamber</div>
  </div>
  <div class="tools">
    <button class="tool" id="btn-tumah" type="button" aria-pressed="false"><span class="dot"></span>Tumah view</button>
    <button class="tool" id="btn-notebook" type="button">Notebook</button>
    <button class="tool" id="btn-lang" type="button" lang="he">עברית</button>
    <button class="tool" id="btn-menu" type="button">Menu</button>
  </div>
</header>

<aside id="status" aria-live="polite"></aside>
<div id="caption" aria-hidden="true"></div>
<div id="menu" hidden></div>
<div id="toast" role="status"></div>

<section id="dlg" hidden aria-live="polite">
  <div class="portrait"></div>
  <div class="body">
    <div class="duel" hidden></div>
    <div class="who"></div>
    <div class="text"></div>
    <div class="choices"></div>
    <button class="next" type="button">Continue ▸</button>
  </div>
</section>

<div id="modal" hidden></div>
<div id="fade"></div>
<!--APP END-->
<script src="../js/analytics.js" data-game="tehara"></script>
<script type="module" src="game.js"></script>
<!-- The Jacob Bros badge: "By Jacob Bros · More games", shown on the title screen only -->
<script src="https://y2jcpa.github.io/JacobBros/badge.js" data-game="tehara" data-show-with="#modal .splash.title" defer></script>
<a href="../privacy.html" style="position:fixed;right:8px;bottom:4px;z-index:9999;font:11px system-ui;color:#aaa;background:#17201ccc;padding:3px">Analytics &amp; privacy</a></body>
</html>
